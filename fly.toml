# fly.toml - Telegram Cloud Drive
app = 'drive-uyee'
primary_region = 'sin'

[build]

[env]
  DATA_DIR = '/data'
  PORT = '3000'
  NODE_ENV = 'production'

[http_service]
  internal_port = 3000
  force_https = true
  # Sesi Telegram harus tetap hidup: jangan tidurkan mesin ini.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 60
    hard_limit = 120

[checks.health]
  type = 'http'
  interval = '30s'
  timeout = '5s'
  grace_period = '30s'
  method = 'GET'
  path = '/health'

[[mounts]]
  source = 'drive_data'
  destination = '/data'

[[vm]]
  size = 'shared-cpu-1x'
  cpus = 1
  memory = '1024mb'
